# Scrape only — alerts are health-check + Uptime Kuma + Telegram (notify.sh).
# No Alertmanager. Grafana dashboards consume this.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
