# Scrape only — alerts are health-check + Gatus + Telegram (notify.sh).
# No Alertmanager. Grafana dashboards consume this.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: ["localhost:8428"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
