name: validate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/pi/*.sh scripts/mac/*.sh scripts/lib/*.sh

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose config (fixture .env)
        run: |
          chmod +x scripts/mac/ci-compose-config.sh
          ./scripts/mac/ci-compose-config.sh

      - name: Full local validation
        run: |
          cp .github/ci.env.fixture .env
          trap 'rm -f .env' EXIT
          chmod +x scripts/mac/validate.sh
          ./scripts/mac/validate.sh
