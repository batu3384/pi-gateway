# Log rotasyonu: JMicron SSD'de 563MB sınırsız json-log birikmişti (audit W2).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  unbound:
    image: klutchell/unbound@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    container_name: unbound
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m
    cpus: "1.5"
    pids_limit: 128
    volumes:
      - ../config/unbound/unbound.conf:/etc/unbound/custom.conf.d/pi-gateway.conf:ro
    ports:
      - "127.0.0.1:5335:5335/tcp"
      - "127.0.0.1:5335:5335/udp"
    # unbound-host = recursive :53. WAN dest:53 drop → forever unhealthy → health-check auto-recover loop.
    # Host health-check.sh dig :5335 is the real probe. No Health = container_health_ok (status none).
    healthcheck:
      disable: true

  adguard:
    image: adguard/adguardhome@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    container_name: adguard
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    cpus: "2.0"
    pids_limit: 256
    # service_healthy waits forever after WAN :53 drop (unbound-host SERVFAIL).
    depends_on:
      unbound:
        condition: service_started
    volumes:
      - ../data/adguard/work:/opt/adguardhome/work
      - ../config/adguard:/opt/adguardhome/conf
    healthcheck:
      # Lokal rewrite testi: WAN kesintisinde AdGuard saglikli kalir (restart firtinasi yok)
      test: ["CMD-SHELL", "nslookup -timeout=2 gateway.${LAN_DOMAIN:-home} 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:fd989c12c74edb8424f53f31a2054459f286967c93e113e91ea95432f066493b
    container_name: docker-socket-proxy
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.5"
    pids_limit: 64
    profiles: ["dozzle"]
    networks:
      - socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Dozzle: sadece container listesi + log okuma (exec/image/pull yok)
      CONTAINERS: 1
      INFO: 1
      LOGS: 1
      EVENTS: 1
      VERSION: 1

  caddy:
    image: caddy@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    container_name: caddy
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m
    cpus: "1.0"
    pids_limit: 128
    profiles: ["caddy"]
    ports:
      # Tailscale Serve 100.x:443 & tailscale0 DNAT yalniz loopback :8088'e gider (LAN erisemez)
      - "${PI_STATIC_IP:-127.0.0.1}:80:80"
      - "${PI_STATIC_IP:-127.0.0.1}:443:443"
      - "${PI_STATIC_IP:-127.0.0.1}:443:443/udp"
      - "127.0.0.1:8088:8088"
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../config/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      glance:
        condition: service_started

  gateway-state:
    image: nginx@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    container_name: gateway-state
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.5"
    pids_limit: 64
    volumes:
      - /var/lib/pi-gateway/public:/usr/share/nginx/html:ro
    expose:
      - "80"
    healthcheck:
      # yeni nginx imajinda wget/curl yok — dosya + surec varligi yeterli
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/state.json && pidof nginx >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  glance:
    image: glanceapp/glance@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    container_name: glance
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: "1.0"
    pids_limit: 128
    depends_on:
      gateway-state:
        condition: service_started
    ports:
      - "127.0.0.1:3040:8080"
    volumes:
      - ../config/glance:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gatus:
    image: ghcr.io/twin/gatus@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    container_name: gatus
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    profiles: ["gatus"]
    depends_on:
      - gateway-state
    ports:
      - "127.0.0.1:${GATUS_PORT:-3001}:8080"
    volumes:
      - ../config/gatus:/config:ro
      - ../data/gatus:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dozzle:
    image: amir20/dozzle@sha256:244f218c876d6ed766277e71a537f34bfb2c01829e1927737e3673a8327deeb8
    container_name: dozzle
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    profiles: ["dozzle"]
    networks:
      - default
      - socket_proxy
    depends_on:
      - docker-socket-proxy
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-9999}:8080"
    volumes:
      - ../data/dozzle:/data
    environment:
      DOZZLE_REMOTE_HOST: tcp://docker-socket-proxy:2375
      DOZZLE_LEVEL: info
      DOZZLE_FILTER: "status=running"
      DOZZLE_AUTH_PROVIDER: simple

  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:60ad3a0ffd2490c4f0d021b95cb4ef856c4d31fb7fa6a6ffa60fd0f4ed1d89ab
    container_name: n8n
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    profiles: ["n8n"]
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: n8n.${LAN_DOMAIN:-home}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n.${LAN_DOMAIN:-home}/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Istanbul}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # executeCommand = host komut yuzeyi; disk/morning host scriptlerinde
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh"]'
    volumes:
      - ../data/n8n:/home/node/.n8n
      - ../data/.disk-probe:/host-ssd:ro

  netalertx:
    image: ghcr.io/netalertx/netalertx@sha256:e8d800176d35a2fcc856ddc68c354a6b472e535c6ed42c52d040b715ca9bb127
    container_name: netalertx
    logging: *default-logging
    restart: unless-stopped
    profiles: ["netalert"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      PORT: ${NETALERTX_PORT:-20211}
      # Host network; docker0 — Caddy host.docker.internal (172.17.0.1) proxy
      LISTEN_ADDR: ${NETALERTX_LISTEN_ADDR:-172.17.0.1}
      PUID: ${NETALERTX_UID:-20211}
      PGID: ${NETALERTX_GID:-1000}
      # Sade: ARP + AdGuard isim. Yeni cihaz: host timer → Jarvis (TELEGRAM yok)
      # Python list; JSON '["x"]' string parse edilince allowlist kırılır (NetAlertX #1023)
      LOADED_PLUGINS: "['ARPSCAN','ADGUARDIMP','NEWDEV','NTFPRCS','DBCLNP','CUSTPROP','SETPWD','SYNC','UI','MAINT']"
      APP_CONF_OVERRIDE: '{"GRAPHQL_PORT":"20214"}'
    volumes:
      - ../data/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
      # necessary_plugins 3 çekirdeği allowlist'e zorlar; ignore_plugin unload eder
      - ../config/netalertx/ignore_plugin:/app/front/plugins/internet_ip/ignore_plugin:ro
      - ../config/netalertx/ignore_plugin:/app/front/plugins/vendor_update/ignore_plugin:ro
      - ../config/netalertx/ignore_plugin:/app/front/plugins/workflows/ignore_plugin:ro
    tmpfs:
      - /tmp:uid=20211,gid=20211,mode=1700
    mem_limit: 384m
    cpus: "1.0"
    pids_limit: 256

  crowdsec:
    image: crowdsecurity/crowdsec@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    container_name: crowdsec
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    profiles: ["crowdsec"]
    environment:
      GID: "1000"
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd"
      DISABLE_ONLINE_API: "${CROWDSEC_DISABLE_ONLINE_API:-true}"
    volumes:
      - ../data/crowdsec/config:/etc/crowdsec
      - ../data/crowdsec/db:/var/lib/crowdsec/data
      - ../config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /run/pi-gateway/crowdsec-logs:/var/log/host-journal:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8082/v1/heartbeat 2>&1 | grep -qE 'HTTP/1\\.[01] (200|401)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    container_name: cloudflared
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    profiles: ["cloudflare"]
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    mem_limit: 96m
    cpus: "0.5"
    pids_limit: 64
    profiles: ["monitoring"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
      - --web.listen-address=127.0.0.1:9100
      - --web.listen-address=172.17.0.1:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/pi-gateway/metrics:/textfile:ro

  victoriametrics:
    image: victoriametrics/victoria-metrics@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    container_name: victoriametrics
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    profiles: ["monitoring"]
    depends_on:
      node-exporter:
        condition: service_started
    command:
      - -promscrape.config=/etc/victoriametrics/promscrape.yml
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=1
      - -memory.allowedBytes=128MB
    volumes:
      - ../config/victoriametrics/promscrape.yml:/etc/victoriametrics/promscrape.yml:ro
      - ../data/victoriametrics:/victoria-metrics-data
    ports:
      - "127.0.0.1:9090:8428"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    container_name: grafana
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    profiles: ["monitoring"]
    depends_on:
      victoriametrics:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-${AGH_ADMIN_USER:-admin}}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${AGH_ADMIN_PASSWORD}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.${LAN_DOMAIN:-home}}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3030}:3000"

volumes:
  caddy_data:
  caddy_config:

networks:
  default: {}
  socket_proxy:
    internal: true
