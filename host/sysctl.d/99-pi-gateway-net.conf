# Pi Gateway — Kernel network, ARP flux & memory tuning (Pi 4B / 4GB + zram)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 4096
net.ipv4.udp_mem = 65536 131072 262144
# eth0 link boot sirasinda henuz hazir degilken Caddy static IP bind'i EADDRNOTAVAIL vermesin
net.ipv4.ip_nonlocal_bind = 1
# Dual-NIC (eth0 + backup wlan0) ayni /24 alt agdayken ARP flux engeli
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
# 99-pi-gateway.conf uzerine ag/zram ekleri (bootstrap uyumlulugu icin ayri dosya)
# 4GB Pi GUI + Docker yukunde aktif sayfalari RAM'de tut; zram0 yalniz acil taşma
vm.swappiness = 15
vm.page-cluster = 0
# Ajan çalışma alanları küçük dosya. Önbelleği çabuk atma.
vm.vfs_cache_pressure = 50
