services:
  unbound:
    image: klutchell/unbound@sha256:a3412dcc5cf5e98dfde226bca68154a80027aaca5c4ffd864fc89140a446ff57
    container_name: unbound
    restart: unless-stopped
    labels:
      autoheal: "true"
    volumes:
      - ../config/unbound/unbound.conf:/etc/unbound/custom.conf.d/pi-gateway.conf:ro
    ports:
      - "127.0.0.1:5335:5335/tcp"
      - "127.0.0.1:5335:5335/udp"
    healthcheck:
      test: ["CMD", "unbound-host", "-t", "A", "cloudflare.com"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  adguard:
    image: adguard/adguardhome@sha256:a2085b04bbfc4759e68fa1d13d4e1558aede67c783c55820e036a95a36dd3ebf
    container_name: adguard
    restart: unless-stopped
    network_mode: host
    labels:
      autoheal: "true"
    depends_on:
      unbound:
        condition: service_healthy
    volumes:
      - ../data/adguard/work:/opt/adguardhome/work
      - ../config/adguard:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD-SHELL", "nslookup -timeout=2 cloudflare.com 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    container_name: docker-socket-proxy
    restart: unless-stopped
    profiles: ["dozzle"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Dozzle: sadece container listesi + log okuma (exec/image/pull yok)
      CONTAINERS: 1
      INFO: 1
      LOGS: 1
      EVENTS: 1
      VERSION: 1

  autoheal:
    # 1.2.0 arm64 manifest (Pi 4 runtime).
    image: willfarrell/autoheal@sha256:e5f5827d7120a50e15af145cdb44bd7eb3af7f12f3d46d7757ce452c5bb5383e
    container_name: autoheal
    restart: unless-stopped
    profiles: ["autoheal"]
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  caddy:
    image: caddy@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    container_name: caddy
    restart: unless-stopped
    profiles: ["caddy"]
    labels:
      autoheal: "true"
    ports:
      # Tailscale Serve 100.x:443 tutabilir — Caddy sadece LAN IP
      - "${PI_STATIC_IP:-127.0.0.1}:80:80"
      - "${PI_STATIC_IP:-127.0.0.1}:443:443"
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../config/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      homepage:
        condition: service_started

  homepage:
    image: ghcr.io/gethomepage/homepage@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "127.0.0.1:3040:3000"
    volumes:
      - ../config/homepage:/app/config
      # ponytail: docker.sock yok — LAN'da auth'suz panel + sock = Docker API yuzeyi
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "gateway.${LAN_DOMAIN:-home},panel.${LAN_DOMAIN:-home},localhost,127.0.0.1"

  uptime-kuma:
    image: louislam/uptime-kuma@sha256:a8610b3b4c38077922ba51b036691e06887d7cefd91fe620fd3d6d23d03dc240
    container_name: uptime-kuma
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ../data/uptime-kuma:/app/data

  dozzle:
    image: amir20/dozzle@sha256:0df89c904da71e94a0c9ed3c89a890f01488321b5f10ac1e0c0bedcead9af6e4
    container_name: dozzle
    restart: unless-stopped
    profiles: ["dozzle"]
    labels:
      autoheal: "true"
    depends_on:
      - docker-socket-proxy
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-9999}:8080"
    volumes:
      - ../data/dozzle:/data
    environment:
      DOZZLE_REMOTE_HOST: tcp://docker-socket-proxy:2375
      DOZZLE_LEVEL: info
      DOZZLE_FILTER: "status=running"
      DOZZLE_AUTH_PROVIDER: simple

  forgejo:
    image: codeberg.org/forgejo/forgejo@sha256:3c34f11fe8b9983096eef3f8f25c2d2c21c4ae7504960cb203f0b075d1d8ed73
    container_name: forgejo
    restart: unless-stopped
    profiles: ["forgejo"]
    labels:
      autoheal: "true"
    environment:
      USER_UID: ${FORGEJO_UID:-1000}
      USER_GID: ${FORGEJO_GID:-1000}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-git.home}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://${FORGEJO_DOMAIN:-git.home}}/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__DISABLE_SSH: "true"
    volumes:
      - ../data/forgejo:/data
    ports:
      - "127.0.0.1:${FORGEJO_PORT:-3002}:3000"

  syncthing:
    image: syncthing/syncthing@sha256:4464f4161dd0251e20d46bb3aec83363db75d80cef1abdd5d5fd4054b04a004d
    container_name: syncthing
    restart: unless-stopped
    profiles: ["syncthing"]
    labels:
      autoheal: "true"
    environment:
      PUID: ${SYNCTHING_UID:-1000}
      PGID: ${SYNCTHING_GID:-1000}
      STGUIADDRESS: 0.0.0.0:8384
      STGUIUSER: ${SYNCTHING_GUI_USER:-}
      STGUIPASSWORD: ${SYNCTHING_GUI_PASSWORD:-}
    volumes:
      - ../data/syncthing:/var/syncthing
      - ../data/projects:/var/syncthing/Projects
    ports:
      - "127.0.0.1:${SYNCTHING_PORT:-8384}:8384"
      # Sync: LAN IP (UFW kisitli); global bind WAN'a acik port birakir
      - "${PI_STATIC_IP:-127.0.0.1}:22000:22000/tcp"
      - "${PI_STATIC_IP:-127.0.0.1}:22000:22000/udp"

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: redis
    restart: unless-stopped
    profiles: ["redis"]
    labels:
      autoheal: "true"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:60ad3a0ffd2490c4f0d021b95cb4ef856c4d31fb7fa6a6ffa60fd0f4ed1d89ab
    container_name: n8n
    restart: unless-stopped
    profiles: ["n8n"]
    labels:
      autoheal: "true"
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: n8n.${LAN_DOMAIN:-home}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n.${LAN_DOMAIN:-home}/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Istanbul}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # executeCommand = host komut yuzeyi; disk/morning host scriptlerinde
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand"]'
      PI_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PI_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ../data/n8n:/home/node/.n8n
      - ../data/.disk-probe:/host-ssd:ro

  netalertx:
    image: ghcr.io/netalertx/netalertx@sha256:e8d800176d35a2fcc856ddc68c354a6b472e535c6ed42c52d040b715ca9bb127
    container_name: netalertx
    restart: unless-stopped
    profiles: ["netalert"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    labels:
      autoheal: "true"
    environment:
      PORT: ${NETALERTX_PORT:-20211}
      # Host network; UI docker0 — Caddy devices.home proxy (LAN IP loopback'a ulasmaz)
      LISTEN_ADDR: ${NETALERTX_LISTEN_ADDR:-172.17.0.1}
      PUID: ${NETALERTX_UID:-20211}
      PGID: ${NETALERTX_GID:-20211}
      LOADED_PLUGINS: '["ARPSCAN","DIGSCAN","NSLOOKUP","ICMP","WEBHOOK","NEWDEV","NTFPRCS","DBCLNP","CUSTPROP","SETPWD","SYNC","UI","MAINT","VNDRPDT","ADGUARDIMP","AVAHISCAN"]'
      APP_CONF_OVERRIDE: '{"GRAPHQL_PORT":"20214"}'
    volumes:
      - ../data/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:uid=20211,gid=20211,mode=1700

  crowdsec:
    image: crowdsecurity/crowdsec@sha256:091229068a9dab7f8c1ae41086669620da2980c6ccc26f9e358a75aaa7cb4a27
    container_name: crowdsec
    restart: unless-stopped
    network_mode: host
    profiles: ["crowdsec"]
    labels:
      autoheal: "true"
    environment:
      GID: "1000"
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd"
      DISABLE_ONLINE_API: "${CROWDSEC_DISABLE_ONLINE_API:-true}"
    volumes:
      - ../data/crowdsec/config:/etc/crowdsec
      - ../data/crowdsec/db:/var/lib/crowdsec/data
      - /var/log/journal:/var/log/journal:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared@sha256:89ee50efb1e9cb2ae30281a8a404fed95eb8f02f0a972617526f8c5b417acae2
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host

  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    restart: unless-stopped
    profiles: ["watchtower"]
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 4 * * 0"
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  caddy_data:
  caddy_config:
