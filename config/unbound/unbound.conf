server:
  verbosity: 0
  # klutchell imaj zaten interface: 0.0.0.0 — tekrar "present twice" (checkconf fatal).
  # port: 5335 imajin ima ettigi :53'u ezer (compose 5335:5335).
  port: 5335
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  access-control: 127.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: 10.0.0.0/8 allow
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-referral-path: no
  use-caps-for-id: no
  # Forward-only TLS (:853) icinde QNAME zaten sifreli; minimisation ekstra adım gecikmesini onler.
  qname-minimisation: no
  minimal-responses: yes
  aggressive-nsec: yes
  edns-buffer-size: 1232
  cache-min-ttl: 60
  cache-max-ttl: 86400
  prefetch: yes
  prefetch-key: yes
  # RFC 8767: once 1.8s icinde canli DoT dene; sadece upstream asiminda bayat kayit don (0ms bayat CDN kilidini onler).
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 1800
  serve-expired-reply-ttl: 30
  num-threads: 4
  msg-cache-slabs: 4
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-slabs: 4
  so-reuseport: yes
  so-rcvbuf: 4m
  so-sndbuf: 4m
  # DoT (:853) kalici TLS 1.3 baglanti havuzu — Cloudflare idle kapatmadan (~10-15s) tazele.
  outgoing-num-tcp: 64
  incoming-num-tcp: 64
  tcp-reuse-timeout: 10000
  max-reuse-tcp-queries: 500
  msg-cache-size: 16m
  rrset-cache-size: 32m
  key-cache-size: 16m
  neg-cache-size: 8m
  private-address: 192.168.0.0/16
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 100.64.0.0/10
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  private-address: ::1/128
  # mDNS / home.arpa upstream'e gitmez (RFC 6762 / RFC 8375)
  local-zone: "local." always_nxdomain
  local-zone: "home.arpa." static

remote-control:
  control-enable: no

# H3600P WAN dest:53 drop kills recursive UDP/TCP 53 (Unbound roots).
# DoT :853 stays open. Cloudflare Security (Istanbul PoP ~5ms, malware-blocking) ensures local CDN/Anycast routing;
# Quad9 (Zurich/Frankfurt ~58ms No-ECS) removed from primary forward-zone to prevent EU CDN misrouting.
forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-addr: 1.1.1.2@853#security.cloudflare-dns.com
  forward-addr: 1.0.0.2@853#security.cloudflare-dns.com
